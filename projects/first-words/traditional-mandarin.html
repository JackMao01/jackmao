        <span class="brand-tile" aria-hidden="true">臺</span>
        <span class="brand-copy"><b>First Words</b><small>Traditional Mandarin · Taipei</small></span>
      </button>
    </div>
    <nav class="tabs top-center" role="tablist" aria-label="Sections">
      <button type="button" role="tab" data-view="today" aria-selected="true">Today</button>
      <button type="button" role="tab" data-view="path" aria-selected="false">Path</button>
      <button type="button" role="tab" data-view="library" aria-selected="false">Library</button>
      <button type="button" role="tab" data-view="places" aria-selected="false">Places</button>
    </nav>
    <div class="top-right"><button type="button" class="data-button" id="practiceData">Data</button><span class="progress-pill"><span id="doneCount">0</span>/15 <span class="progress-copy">complete</span></span></div>
  </header>

  <main id="main" style="view-transition-name: project-hero">
    <section class="view" id="view-today" aria-label="Today's Traditional Mandarin practice"></section>
    <section class="view" id="view-path" hidden aria-label="Traditional Mandarin lesson path"></section>
    <section class="view" id="view-library" hidden aria-label="Traditional Mandarin phrase library"></section>
    <section class="view" id="view-places" hidden aria-label="Traditional Mandarin place routes"></section>
  </main>

  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-backdrop" id="sheetBackdrop"></div>
    <div class="sheet-panel">
      <div class="grabber" aria-hidden="true"></div>
      <div class="sheet-head"><h2 id="sheetTitle">First Words</h2><button type="button" class="sheet-close" id="sheetClose" aria-label="Close">×</button></div>
      <div id="sheetBody"></div>
    </div>
  </div>

  <nav class="tabbar" role="tablist" aria-label="Sections">
    <button type="button" role="tab" data-view="today" aria-selected="true">Today</button>
    <button type="button" role="tab" data-view="path" aria-selected="false">Path</button>
    <button type="button" role="tab" data-view="library" aria-selected="false">Library</button>
    <button type="button" role="tab" data-view="places" aria-selected="false">Places</button>
  </nav>
  <div id="toast" role="status" aria-live="polite"></div>

  <script>
    const lessons = [
      { title: "Four tones, one light tone", chapter: "Sound", focus: "Hear how pitch changes the meaning of a syllable.", phrases: [["媽","mā","mother"],["麻","má","hemp"],["馬","mǎ","horse"],["罵","mà","to scold"],["嗎","ma","question particle"]] },
      { title: "Initial sounds", chapter: "Sound", focus: "Keep familiar-looking consonants clear and unhurried.", phrases: [["八","bā","eight"],["怕","pà","afraid"],["大","dà","big"],["他","tā","he"],["你","nǐ","you"]] },
      { title: "Traditional characters", chapter: "Script", focus: "Recognize a few characters you will meet across Taipei.", phrases: [["門","mén","door"],["車","chē","vehicle"],["站","zhàn","station"],["東","dōng","east"],["臺北","Táiběi","Taipei"]] },
      { title: "Questions and particles", chapter: "Structure", focus: "Turn a statement into a useful first question.", phrases: [["嗎","ma","question particle"],["呢","ne","and you / what about"],["哪裡","nǎlǐ","where"],["什麼","shénme","what"],["可以嗎","kěyǐ ma","Is it okay?"]] },
      { title: "First greetings", chapter: "Exchange", focus: "Open and close a simple exchange.", phrases: [["你好","nǐ hǎo","Hello"],["早安","zǎo ān","Good morning"],["晚安","wǎn ān","Good night"],["再見","zài jiàn","Goodbye"]] },
      { title: "Introduce yourself", chapter: "Exchange", focus: "Share who you are and why you are learning.", phrases: [["我叫 Jack","wǒ jiào Jack","My name is Jack"],["我從加拿大來","wǒ cóng Jiānádà lái","I come from Canada"],["很高興認識你","hěn gāoxìng rènshi nǐ","Nice to meet you"],["我在學中文","wǒ zài xué Zhōngwén","I am learning Chinese"]] },
      { title: "Courtesy", chapter: "Exchange", focus: "Move gently through everyday interactions.", phrases: [["謝謝","xièxie","Thank you"],["不好意思","bù hǎoyìsi","Excuse me / sorry"],["請","qǐng","Please"],["沒關係","méi guānxi","It is okay"]] },
      { title: "Numbers and prices", chapter: "Daily life", focus: "Count a few things and ask what something costs.", phrases: [["一個","yí ge","One item"],["兩個","liǎng ge","Two items"],["多少錢","duōshao qián","How much is it?"],["我要這個","wǒ yào zhège","I would like this one"]] },
      { title: "Time and plans", chapter: "Daily life", focus: "Ask when something begins and name a simple day.", phrases: [["現在幾點","xiànzài jǐ diǎn","What time is it now?"],["幾點開門","jǐ diǎn kāimén","What time does it open?"],["今天","jīntiān","Today"],["明天","míngtiān","Tomorrow"]] },
      { title: "Ordering", chapter: "Daily life", focus: "Ask, choose, and order with confidence.", phrases: [["我要這個","wǒ yào zhège","I would like this one"],["請給我一杯水","qǐng gěi wǒ yì bēi shuǐ","A glass of water, please"],["你推薦什麼","nǐ tuījiàn shénme","What do you recommend?"],["買單","mǎidān","The bill, please"]] },
      { title: "Preferences and needs", chapter: "Daily life", focus: "Communicate a dietary need and ask for clarity.", phrases: [["我不吃肉","wǒ bù chī ròu","I do not eat meat"],["我吃素","wǒ chī sù","I am vegetarian"],["有英文菜單嗎","yǒu Yīngwén càidān ma","Is there an English menu?"],["請說慢一點","qǐng shuō màn yìdiǎn","Please speak more slowly"]] },
      { title: "Finding your way", chapter: "In place", focus: "Orient yourself with a few clear directions.", phrases: [["捷運站在哪裡","jiéyùn zhàn zài nǎlǐ","Where is the metro station?"],["右邊","yòubiān","Right"],["左邊","zuǒbiān","Left"],["直走","zhí zǒu","Go straight"],["很近嗎","hěn jìn ma","Is it nearby?"]] },
      { title: "Taking the metro", chapter: "In place", focus: "Confirm the route before you board.", phrases: [["要搭哪一班車","yào dā nǎ yì bān chē","Which train should I take?"],["這班車到台北車站嗎","zhè bān chē dào Táiběi Chēzhàn ma","Does this train go to Taipei Main Station?"],["下一站是哪裡","xià yí zhàn shì nǎlǐ","What is the next station?"],["一張票","yì zhāng piào","One ticket"]] },
      { title: "Staying overnight", chapter: "In place", focus: "Handle arrival and one practical request.", phrases: [["我有預訂","wǒ yǒu yùdìng","I have a reservation"],["我要辦理入住","wǒ yào bànlǐ rùzhù","I would like to check in"],["可以寄放行李嗎","kěyǐ jìfàng xínglǐ ma","May I leave my luggage?"],["有 Wi-Fi 嗎","yǒu Wi-Fi ma","Is there Wi-Fi?"]] },
      { title: "A first conversation", chapter: "Capstone", focus: "Join familiar phrases into one calm exchange.", phrases: [["不好意思，捷運站在哪裡","bù hǎoyìsi, jiéyùn zhàn zài nǎlǐ","Excuse me, where is the metro station?"],["直走，在右邊","zhí zǒu, zài yòubiān","Go straight; it is on the right"],["我知道了","wǒ zhīdào le","I understand"],["謝謝","xièxie","Thank you"]] }
    ];

    const placeRoutes = {
      taipei: {
        title: "Taipei", mark: "臺北", label: "Capital city · metro and market route",
        intro: "A practical route through Taipei Main Station, a neighbourhood counter, and the evening city.",
        guideUrl: "../wayfarer/taipei.html", guideLabel: "Open the Taipei guide",
        groups: [
          { title: "Arrive", note: "Find the metro and make the first transfer clearly.", phrases: [["台北車站在哪裡","Táiběi Chēzhàn zài nǎlǐ","Where is Taipei Main Station?"],["悠遊卡在哪裡買","Yōuyóukǎ zài nǎlǐ mǎi","Where can I buy an EasyCard?"],["這班捷運到中山站嗎","zhè bān jiéyùn dào Zhōngshān Zhàn ma","Does this metro go to Zhongshan Station?"]] },
          { title: "Order", note: "Choose simply and adjust one detail.", phrases: [["你推薦什麼","nǐ tuījiàn shénme","What do you recommend?"],["我要一杯珍珠奶茶","wǒ yào yì bēi zhēnzhū nǎichá","I would like a bubble tea"],["不要太甜","bú yào tài tián","Not too sweet"]] },
          { title: "Continue", note: "Find the exit and close the exchange with care.", phrases: [["出口在哪裡","chūkǒu zài nǎlǐ","Where is the exit?"],["可以刷卡嗎","kěyǐ shuākǎ ma","Can I pay by card?"],["謝謝你的幫忙","xièxie nǐ de bāngmáng","Thank you for your help"]] }
        ]
      }
    };

    const $ = (s, root = document) => root.querySelector(s);
    const $$ = (s, root = document) => [...root.querySelectorAll(s)];
    const esc = value => String(value).replace(/[&<>'"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[ch]));
    const KEY = "hana.mandarin-tw.v1";
    const defaultState = () => ({ v: 1, done: lessons.map(() => false), lastLesson: 0 });
    function load() {
      try {
        const parsed = JSON.parse(localStorage.getItem(KEY));
        if (parsed && parsed.v === 1 && Array.isArray(parsed.done)) return { ...defaultState(), ...parsed, done: lessons.map((_, i) => Boolean(parsed.done[i])) };
      } catch (error) {}
      return defaultState();
    }
    let state = load();
    let currentView = "today";
    let sheetCleanup = null;
    let sheetOrigin = null;
    let sheetScroll = 0;
    function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (error) {} }
    function nextLesson() { const next = state.done.findIndex(item => !item); return next < 0 ? lessons.length - 1 : next; }
    function toast(message) { const el = $("#toast"); el.textContent = message; el.classList.add("show"); clearTimeout(toast.timer); toast.timer = setTimeout(() => el.classList.remove("show"), 1800); }

    function openSheet(title, html, cleanup) {
      if (!$("#sheet").classList.contains("open")) {
        sheetOrigin = document.activeElement;
        sheetScroll = window.scrollY;
      }
      if (sheetCleanup) sheetCleanup();
      sheetCleanup = cleanup || null;
      $("#sheetTitle").textContent = title;
      $("#sheetBody").innerHTML = html;
      $("#sheet").classList.add("open");
      $("#sheet .sheet-panel").scrollTop = 0;
      $("#sheetClose").focus();
    }
    function closeSheet() {
      if (sheetCleanup) sheetCleanup();
      sheetCleanup = null;
      $("#sheet").classList.remove("open");
      renderAll();
      const replacement = sheetOrigin?.id ? document.getElementById(sheetOrigin.id)
        : sheetOrigin?.hasAttribute("data-lesson") ? document.querySelector('[data-lesson="' + sheetOrigin.dataset.lesson + '"]')
        : sheetOrigin?.hasAttribute("data-place") ? document.querySelector('[data-place="' + sheetOrigin.dataset.place + '"]')
        : sheetOrigin;
      if (replacement?.isConnected) replacement.focus({ preventScroll: true });
      window.scrollTo({ top: sheetScroll, behavior: "instant" });
    }
    function setView(name) {
      currentView = name;
      ["today","path","library","places"].forEach(view => $("#view-" + view).hidden = view !== name);
      $$('[data-view]').forEach(button => button.setAttribute("aria-selected", String(button.dataset.view === name)));
      window.scrollTo(0, 0);
    }

    let languageVoice = null;
    function loadVoice() {
      if (!("speechSynthesis" in window)) return;
      languageVoice = speechSynthesis.getVoices().find(voice => /^zh-TW$/i.test(voice.lang)) || speechSynthesis.getVoices().find(voice => /^(zh-(CN|SG)|cmn(-.*)?)$/i.test(voice.lang) && !/Cantonese/i.test(voice.name)) || null;
    }
    function speak(text) {
      if (!("speechSynthesis" in window)) { toast("Speech is not available in this browser."); return; }
      loadVoice();
      if (!languageVoice) { toast("No Mandarin voice is available on this device. You can still use the written pronunciation."); return; }
      try {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "zh-TW";
        utterance.rate = 0.82;
        utterance.onerror = () => toast("Could not play this phrase. Check your device's speech settings.");
        if (languageVoice) utterance.voice = languageVoice;
        if (speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();
        speechSynthesis.speak(utterance);
      } catch (error) { toast("Could not play this phrase."); }
    }

    function phraseMarkup(phrases) {
      return `<div class="phrase-list">${phrases.map(([text,reading,en]) => `<div class="phrase"><span><span class="phrase-jp" lang="zh-Hant">${esc(text)}</span><span class="phrase-reading">${esc(reading)}</span><span class="phrase-en">${esc(en)}</span></span><button type="button" class="listen" data-say="${esc(text)}" aria-label="Listen to ${esc(text)}">▶</button></div>`).join("")}</div>`;
    }
    function bindListen(root = document) { $$('[data-say]', root).forEach(button => button.addEventListener("click", () => speak(button.dataset.say))); }

    function stringScore(value) {
      return [...String(value)].reduce((score, character, index) => score + character.charCodeAt(0) * (index + 3), 0);
    }
    function choiceSet(correct, pool, seed = 0) {
      const alternatives = [...new Set(pool.filter(item => item !== correct))]
        .sort((a, b) => stringScore(a + seed) - stringScore(b + seed));
      return [correct, ...alternatives.slice(0, 3)]
        .sort((a, b) => stringScore(a + seed + "a") - stringScore(b + seed + "a"));
    }
    function checkMarkup(phrase, choices, label = "Check understanding") {
      return `<section class="check-card"><div class="kicker">${esc(label)}</div><h3>Which Traditional Mandarin phrase means “${esc(phrase[2])}”?</h3><div class="check-options">${choices.map(choice => `<button type="button" class="check-option" data-check-choice="${esc(choice)}" lang="zh-Hant">${esc(choice)}</button>`).join("")}</div><p class="check-feedback" id="checkFeedback" role="status" aria-live="polite">Choose one answer.</p></section>`;
    }
    function bindCheck(root, correct, onCorrect) {
      const feedback = $("#checkFeedback", root);
      $$('[data-check-choice]', root).forEach(button => button.addEventListener("click", () => {
        if (button.dataset.checkChoice === correct) {
          $$('[data-check-choice]', root).forEach(option => { option.disabled = true; });
          button.classList.add("is-right");
          feedback.textContent = "Correct. Say it once more, then continue.";
          onCorrect();
        } else {
          button.classList.remove("is-wrong");
          requestAnimationFrame(() => button.classList.add("is-wrong"));
          feedback.textContent = "Not quite. Listen again and try another.";
        }
      }));
    }

    function openLesson(index) {
      const lesson = lessons[index];
      const checkPhrase = lesson.phrases[(index + 1) % lesson.phrases.length];
      const choices = choiceSet(checkPhrase[0], lesson.phrases.map(phrase => phrase[0]), index);
      openSheet(`Lesson ${index + 1} · ${lesson.title}`, `<p class="sheet-lede">${esc(lesson.focus)} Listen first, then repeat each phrase out loud.</p>${phraseMarkup(lesson.phrases)}${checkMarkup(checkPhrase, choices)}<div class="sheet-actions"><button type="button" class="btn" id="completeLesson" ${state.done[index] ? "" : "disabled"}>${state.done[index] ? "Practice complete" : "Complete lesson"}</button></div>`);
      bindListen($("#sheetBody"));
      bindCheck($("#sheetBody"), checkPhrase[0], () => { $("#completeLesson").disabled = false; });
      $("#completeLesson").addEventListener("click", () => {
        state.done[index] = true; state.lastLesson = index; save(); closeSheet(); toast("Lesson complete.");
      });
    }

    function reviewPhrases() {
      const pool = lessons.flatMap((lesson, lessonIndex) => state.done[lessonIndex] ? lesson.phrases : []);
      if (!pool.length) return [];
      const offset = new Date().getDate() % pool.length;
      return Array.from({ length: Math.min(5, pool.length) }, (_, index) => pool[(offset + index * 3) % pool.length]);
    }
    function openReview() {
      const cards = reviewPhrases();
      if (!cards.length) { toast("Complete a lesson to begin reviewing."); return; }
      const answerPool = lessons.flatMap((lesson, lessonIndex) => state.done[lessonIndex] ? lesson.phrases.map(phrase => phrase[0]) : []);
      let cardIndex = 0;
      let score = 0;
      openSheet("Quick review", "");
      const renderCard = () => {
        if (cardIndex >= cards.length) {
          $("#sheetBody").innerHTML = `<div class="check-card"><div class="kicker">Review complete</div><h3>${score}/${cards.length} correct</h3><p class="sheet-lede">A short return is enough to keep familiar phrases within reach.</p></div><div class="sheet-actions"><button type="button" class="btn" id="reviewDone">Done</button></div>`;
          $("#reviewDone").addEventListener("click", closeSheet);
          return;
        }
        const phrase = cards[cardIndex];
        const choices = choiceSet(phrase[0], answerPool, cardIndex + phrase[2].length);
        $("#sheetBody").innerHTML = `<div class="review-count"><span>Card ${cardIndex + 1} of ${cards.length}</span><span>${score} correct</span></div>${checkMarkup(phrase, choices, "Quick recall")}<div class="sheet-actions"><button type="button" class="btn" id="reviewNext" disabled>${cardIndex === cards.length - 1 ? "See result" : "Next phrase"}</button></div>`;
        bindCheck($("#sheetBody"), phrase[0], () => {
          score += 1;
          $("#reviewNext").disabled = false;
        });
        $("#reviewNext").addEventListener("click", () => { cardIndex += 1; renderCard(); });
      };
      renderCard();
    }

    function openPracticeData() {
      openSheet("Practice data", `<p class="sheet-lede">Your Traditional Mandarin progress stays in this browser. Export a small backup before changing devices or clearing browser data.</p><p class="data-note"><strong>${state.done.filter(Boolean).length} of ${lessons.length} lessons complete</strong><br>Only progress is saved. No account or personal information is collected.</p><div class="sheet-actions"><button type="button" class="btn ghost" id="exportPractice">Export</button><button type="button" class="btn ghost" id="importPractice">Import</button><button type="button" class="btn" id="resetPractice">Reset</button></div>`);
      $("#exportPractice").addEventListener("click", () => {
        try {
          const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url; link.download = "first-words-traditional-mandarin-practice.json"; link.click();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          toast("Practice exported.");
        } catch (error) { toast("Export failed."); }
      });
      $("#importPractice").addEventListener("click", () => {
        const input = document.createElement("input");
        input.type = "file"; input.accept = "application/json,.json";
        input.addEventListener("change", async () => {
          try {
            const parsed = JSON.parse(await input.files[0].text());
            if (!parsed || !Array.isArray(parsed.done)) throw new Error("Invalid practice file");
            state = { ...defaultState(), ...parsed, v: 1, done: lessons.map((_, index) => Boolean(parsed.done[index])), lastLesson: Math.max(0, Math.min(lessons.length - 1, Number(parsed.lastLesson) || 0)) };
            save(); closeSheet(); toast("Practice restored.");
          } catch (error) { toast("That practice file could not be read."); }
        });
        input.click();
      });
      $("#resetPractice").addEventListener("click", () => {
        if (!confirm("Reset all Traditional Mandarin progress on this device?")) return;
        state = defaultState(); save(); closeSheet(); toast("Traditional Mandarin progress reset.");
      });
    }

    function openPlaceRoute(key) {
      const route = placeRoutes[key];
      if (!route) return;
      const groups = route.groups.map((group, index) => `<section class="route-group"><div class="route-group-head"><h3>${esc(group.title)}</h3><span>${String(index + 1).padStart(2,"0")}</span></div><p class="route-note">${esc(group.note)}</p>${phraseMarkup(group.phrases)}</section>`).join("");
      const guide = route.guideUrl ? `<a class="btn" data-language-route-transition href="${esc(route.guideUrl)}">${esc(route.guideLabel)} →</a>` : `<span class="btn ghost" aria-disabled="true">${esc(route.guideLabel)}</span>`;
      openSheet(`${route.title} applied route`, `<p class="sheet-lede">Use the foundation in context. Move through three small situations without turning the route into a script.</p>${groups}<div class="sheet-actions">${guide}</div>`);
      bindListen($("#sheetBody"));
    }

    function openLanguages() {
      openSheet("Choose a language", `<div class="language-switcher"><a class="language-track" href="korean.html"><span class="language-glyph" aria-hidden="true">한</span><span><b>Korean</b><small>15 lessons · 4 routes</small></span><span class="language-state">Open →</span></a><a class="language-track" href="japanese.html"><span class="language-glyph jp" aria-hidden="true">あ</span><span><b>Japanese</b><small>15 lessons · 3 routes</small></span><span class="language-state">Open →</span></a><div class="language-track is-current" aria-current="page"><span class="language-glyph zh" aria-hidden="true">臺</span><span><b>Traditional Mandarin</b><small>15 lessons · Taipei route</small></span><span class="language-state">Current</span></div><a class="language-track" href="cantonese.html"><span class="language-glyph zh" aria-hidden="true">港</span><span><b>Cantonese</b><small>15 lessons · Hong Kong route</small></span><span class="language-state">Open →</span></a></div><a class="language-home" href="chinese.html">← Chinese language home</a>`);
    }

    function renderToday() {
      const count = state.done.filter(Boolean).length;
      const index = nextLesson();
      const lesson = lessons[index];
      $("#view-today").innerHTML = `<div class="practice-hero"><div class="practice-grid"><div><div class="kicker">Traditional Mandarin foundation</div><h1>${count === lessons.length ? "Keep the language close." : "One small lesson today."}</h1><p>${count === lessons.length ? "The foundation is complete. Revisit a lesson or carry the phrases into Taipei." : lesson.focus}</p></div><div class="day-mark"><span>${String(index + 1).padStart(2,"0")}</span><small>${count}/${lessons.length} complete</small></div></div><div class="hero-action"><button type="button" class="btn dark" id="todayLesson">${count === lessons.length ? "Revisit final lesson" : `Begin ${lesson.title}`}</button>${count ? `<button type="button" class="btn dark" id="todayReview">Quick review</button>` : ""}<button type="button" class="btn dark" id="todayPlaces">Open Taipei route</button></div></div><div class="today-strip"><div><span>Track</span><b>Mandarin</b></div><div><span>Next</span><b>${esc(lesson.title)}</b></div><div><span>Route</span><b>Taipei</b></div></div><header class="view-heading"><div class="kicker">Daily rhythm</div><h1>Listen. Repeat. Place.</h1><p>Build the foundation in sequence, check what you remember, then use the same language inside a day in Taipei.</p></header>`;
      $("#todayLesson").addEventListener("click", () => openLesson(index));
      if ($("#todayReview")) $("#todayReview").addEventListener("click", openReview);
      $("#todayPlaces").addEventListener("click", () => setView("places"));
    }
    function renderPath() {
      const count = state.done.filter(Boolean).length;
      $("#view-path").innerHTML = `<header class="view-heading"><div class="kicker">Curriculum</div><h1>Fifteen foundations</h1><p>Sound, Traditional characters, first exchanges, and practical city language build toward a short conversation.</p></header><div class="path-meter"><div class="meter"><i style="width:${count / lessons.length * 100}%"></i></div><b>${count}/${lessons.length}</b></div><div class="lesson-list">${lessons.map((lesson,index) => `<button type="button" class="lesson-row ${state.done[index] ? "is-done" : ""}" data-lesson="${index}"><span class="lesson-num">${state.done[index] ? "✓" : String(index + 1).padStart(2,"0")}</span><span><span class="lesson-title">${esc(lesson.title)}</span><span class="lesson-focus">${esc(lesson.chapter)} · ${esc(lesson.focus)}</span></span><span class="lesson-state">${state.done[index] ? "Done" : index === nextLesson() ? "Next" : "Open"}</span></button>`).join("")}</div>`;
      $$('[data-lesson]', $("#view-path")).forEach(button => button.addEventListener("click", () => openLesson(Number(button.dataset.lesson))));
    }
    function renderLibrary(query = "", shouldFocus = false) {
      const q = query.trim().toLowerCase();
      const all = lessons.flatMap(lesson => lesson.phrases.map(phrase => ({ lesson: lesson.title, phrase })));
      const filtered = all.filter(item => !q || item.phrase.join(" ").toLowerCase().includes(q) || item.lesson.toLowerCase().includes(q));
      $("#view-library").innerHTML = `<header class="view-heading"><div class="kicker">Phrasebook</div><h1>Your Mandarin library</h1><p>Search every character, Pinyin reading, and meaning in the foundation, then listen again whenever you need it.</p></header><div class="library-tools"><input class="search" id="searchPhrases" type="search" value="${esc(query)}" placeholder="Search characters, Pinyin, or meaning" aria-label="Search phrases"></div>${filtered.length ? phraseMarkup(filtered.map(item => item.phrase)) : `<p class="sheet-lede">No phrases match that search.</p>`}`;
      $("#searchPhrases").addEventListener("input", event => renderLibrary(event.target.value, true));
      if (shouldFocus) { const input = $("#searchPhrases"); input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
      bindListen($("#view-library"));
    }
    function renderPlaces() {
      const cards = Object.entries(placeRoutes).map(([key,route], index) => `<article class="place-card"><div><span class="place-mark-small" lang="zh-Hant">${route.mark}</span><div class="kicker">Route ${String(index + 1).padStart(2,"0")}</div><h2>${esc(route.title)}</h2><p>${esc(route.label)}. ${esc(route.intro)}</p></div><button type="button" class="btn small" data-place="${key}">Open route</button></article>`).join("");
      $("#view-places").innerHTML = `<div class="place-intro"><div><div class="kicker">Language in place</div><h1>One city, many small exchanges.</h1><p>Taipei turns the foundation into movement: arriving, ordering, finding the right exit, and continuing with care.</p></div><div class="place-kanji" lang="zh-Hant">臺北</div></div><div class="place-grid">${cards}</div>`;
      $$('[data-place]', $("#view-places")).forEach(button => button.addEventListener("click", () => openPlaceRoute(button.dataset.place)));
    }
    function renderTop() { $("#doneCount").textContent = state.done.filter(Boolean).length; }
    function renderAll() { renderTop(); renderToday(); renderPath(); renderLibrary(); renderPlaces(); setView(currentView); }

    $$('[data-view]').forEach(button => button.addEventListener("click", () => setView(button.dataset.view)));
    $("#languageBtn").addEventListener("click", openLanguages);
    $("#practiceData").addEventListener("click", openPracticeData);
    $("#sheetClose").addEventListener("click", closeSheet);
    $("#sheetBackdrop").addEventListener("click", closeSheet);
    document.addEventListener("keydown", event => {
      const sheet = $("#sheet");
      if (!sheet.classList.contains("open")) return;
      if (event.key === "Escape") { event.preventDefault(); closeSheet(); return; }
      if (event.key !== "Tab") return;
      const controls = $$('a[href], button:not([disabled]), input:not([disabled]), [tabindex="0"]', sheet)
        .filter(control => control.getClientRects().length);
      const first = controls[0], last = controls[controls.length - 1];
      if (event.shiftKey && (document.activeElement === first || !sheet.contains(document.activeElement))) {
        event.preventDefault(); last?.focus();
      } else if (!event.shiftKey && (document.activeElement === last || !sheet.contains(document.activeElement))) {
        event.preventDefault(); first?.focus();
      }
    });
    if ("speechSynthesis" in window) { loadVoice(); speechSynthesis.addEventListener("voiceschanged", loadVoice); }
    renderAll();
    const requestedPlace = new URLSearchParams(location.search).get("place");
    if (requestedPlace && placeRoutes[requestedPlace]) { setView("places"); requestAnimationFrame(() => openPlaceRoute(requestedPlace)); }
    if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
  </script>
  <script defer src="../../analytics.js"></script>
</body>
</html>
