    const lessons = [
      { title: "Hiragana vowels", chapter: "Script", focus: "Meet the five open sounds that anchor the script.", phrases: [["あ","a","a"],["い","i","i"],["う","u","u"],["え","e","e"],["お","o","o"]] },
      { title: "K and S lines", chapter: "Script", focus: "Build the first consonant rhythms.", phrases: [["か","ka","ka"],["き","ki","ki"],["く","ku","ku"],["さ","sa","sa"],["し","shi","shi"]] },
      { title: "T, N, and H lines", chapter: "Script", focus: "Recognize another family of everyday sounds.", phrases: [["た","ta","ta"],["ち","chi","chi"],["つ","tsu","tsu"],["な","na","na"],["に","ni","ni"],["ひ","hi","hi"]] },
      { title: "Small and voiced sounds", chapter: "Script", focus: "Notice the marks and combinations that change a word.", phrases: [["が","ga","ga"],["ぱ","pa","pa"],["きゃ","kya","kya"],["きって","kitte","postage stamp"],["にほん","nihon","Japan"]] },
      { title: "First greetings", chapter: "Exchange", focus: "Open and close a simple exchange.", phrases: [["こんにちは","konnichiwa","Hello"],["おはようございます","ohayou gozaimasu","Good morning"],["こんばんは","konbanwa","Good evening"],["さようなら","sayounara","Goodbye"]] },
      { title: "Introduce yourself", chapter: "Exchange", focus: "Share who you are and where you came from.", phrases: [["わたしはジャックです","watashi wa Jakku desu","I am Jack"],["カナダから来ました","Kanada kara kimashita","I came from Canada"],["はじめまして","hajimemashite","Nice to meet you"],["よろしくおねがいします","yoroshiku onegaishimasu","Pleased to meet you"]] },
      { title: "Courtesy", chapter: "Exchange", focus: "Move gently through everyday interactions.", phrases: [["ありがとうございます","arigatou gozaimasu","Thank you"],["すみません","sumimasen","Excuse me / sorry"],["おねがいします","onegaishimasu","Please"],["だいじょうぶです","daijoubu desu","It is okay"]] },
      { title: "Numbers and prices", chapter: "Daily life", focus: "Count a few things and ask what something costs.", phrases: [["ひとつ","hitotsu","One item"],["ふたつ","futatsu","Two items"],["いくらですか","ikura desu ka","How much is it?"],["これをください","kore o kudasai","This one, please"]] },
      { title: "Time and plans", chapter: "Daily life", focus: "Ask when something begins and name a simple day.", phrases: [["いま何時ですか","ima nanji desu ka","What time is it now?"],["何時に開きますか","nanji ni akimasu ka","What time does it open?"],["きょう","kyou","Today"],["あした","ashita","Tomorrow"]] },
      { title: "Ordering", chapter: "Daily life", focus: "Ask, choose, and order with confidence.", phrases: [["これをください","kore o kudasai","This one, please"],["みずをください","mizu o kudasai","Water, please"],["おすすめは何ですか","osusume wa nan desu ka","What do you recommend?"],["お会計をおねがいします","okaikei o onegaishimasu","The bill, please"]] },
      { title: "Preferences and needs", chapter: "Daily life", focus: "Communicate a dietary need and ask for help.", phrases: [["肉は食べません","niku wa tabemasen","I do not eat meat"],["ベジタリアンです","bejitarian desu","I am vegetarian"],["英語のメニューはありますか","eigo no menyuu wa arimasu ka","Is there an English menu?"],["ゆっくりおねがいします","yukkuri onegaishimasu","Slowly, please"]] },
      { title: "Finding your way", chapter: "In place", focus: "Orient yourself with a few clear directions.", phrases: [["駅はどこですか","eki wa doko desu ka","Where is the station?"],["みぎ","migi","Right"],["ひだり","hidari","Left"],["まっすぐ","massugu","Straight ahead"],["近いですか","chikai desu ka","Is it nearby?"]] },
      { title: "Taking the train", chapter: "In place", focus: "Confirm the route before you board.", phrases: [["どの電車ですか","dono densha desu ka","Which train is it?"],["この電車は東京に行きますか","kono densha wa Toukyou ni ikimasu ka","Does this train go to Tokyo?"],["次の駅はどこですか","tsugi no eki wa doko desu ka","What is the next station?"],["切符を一枚ください","kippu o ichimai kudasai","One ticket, please"]] },
      { title: "Staying overnight", chapter: "In place", focus: "Handle arrival and one practical request.", phrases: [["予約しています","yoyaku shiteimasu","I have a reservation"],["チェックインをおねがいします","chekkuin o onegaishimasu","I would like to check in"],["荷物を預けてもいいですか","nimotsu o azukete mo ii desu ka","May I leave my luggage?"],["Wi-Fiはありますか","waifai wa arimasu ka","Is there Wi-Fi?"]] },
      { title: "A first conversation", chapter: "Capstone", focus: "Join familiar phrases into one calm exchange.", phrases: [["すみません、駅はどこですか","sumimasen, eki wa doko desu ka","Excuse me, where is the station?"],["まっすぐ行って、みぎです","massugu itte, migi desu","Go straight, then it is on the right"],["わかりました","wakarimashita","I understand"],["ありがとうございます","arigatou gozaimasu","Thank you"]] }
    ];

    const placeRoutes = {
      kyoto: {
        title: "Kyoto", mark: "京都", label: "Temple city · slow route",
        intro: "A quieter route through stations, cafés, temples, and small moments of courtesy.",
        guideUrl: "../wayfarer/shizuka.html", guideLabel: "Open the Kyoto guide",
        groups: [
          { title: "Arrive", note: "Confirm the train and find your bearings.", phrases: [["この電車は京都に行きますか","kono densha wa Kyouto ni ikimasu ka","Does this train go to Kyoto?"],["京都駅はどこですか","Kyouto-eki wa doko desu ka","Where is Kyoto Station?"],["切符を一枚ください","kippu o ichimai kudasai","One ticket, please"]] },
          { title: "Move quietly", note: "Ask before entering, photographing, or changing course.", phrases: [["ここに入ってもいいですか","koko ni haitte mo ii desu ka","May I enter here?"],["写真を撮ってもいいですか","shashin o totte mo ii desu ka","May I take a photo?"],["近いですか","chikai desu ka","Is it nearby?"]] },
          { title: "Pause", note: "Order simply and end with care.", phrases: [["おすすめは何ですか","osusume wa nan desu ka","What do you recommend?"],["お茶をください","ocha o kudasai","Tea, please"],["ありがとうございます","arigatou gozaimasu","Thank you"]] }
        ]
      },
      tokyo: {
        title: "Tokyo", mark: "東京", label: "Capital city · urban route",
        intro: "A faster companion for platforms, counters, neighbourhoods, and the useful questions between them.",
        guideUrl: "../wayfarer/tokyo.html", guideLabel: "Open the Tokyo guide",
        groups: [
          { title: "Navigate", note: "Keep the line, exit, and transfer clear.", phrases: [["どの電車ですか","dono densha desu ka","Which train is it?"],["渋谷まで行きますか","Shibuya made ikimasu ka","Does this go to Shibuya?"],["出口はどこですか","deguchi wa doko desu ka","Where is the exit?"]] },
          { title: "Choose", note: "Ask at a counter without rushing the exchange.", phrases: [["これをください","kore o kudasai","This one, please"],["いくらですか","ikura desu ka","How much is it?"],["カードは使えますか","kaado wa tsukaemasu ka","Can I use a card?"]] },
          { title: "Reset", note: "Find a quieter place and ask for what you need.", phrases: [["静かなカフェはありますか","shizuka na kafe wa arimasu ka","Is there a quiet café?"],["ゆっくりおねがいします","yukkuri onegaishimasu","Slowly, please"],["だいじょうぶです","daijoubu desu","It is okay"]] }
        ]
      }
    };

    const $ = (s, root = document) => root.querySelector(s);
    const $$ = (s, root = document) => [...root.querySelectorAll(s)];
    const esc = value => String(value).replace(/[&<>'"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[ch]));
    const KEY = "hana.japanese.v1";
    const defaultState = () => ({ v: 1, done: lessons.map(() => false), lastLesson: 0 });
    function load() {
      try {
        const parsed = JSON.parse(localStorage.getItem(KEY));
        if (parsed && parsed.v === 1 && Array.isArray(parsed.done)) return { ...defaultState(), ...parsed, done: lessons.map((_, i) => Boolean(parsed.done[i])) };
      } catch (error) {}
      return defaultState();
    }
    let state = load();
    let currentView = "today";
    let sheetCleanup = null;
    function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (error) {} }
    function nextLesson() { const next = state.done.findIndex(item => !item); return next < 0 ? lessons.length - 1 : next; }
    function toast(message) { const el = $("#toast"); el.textContent = message; el.classList.add("show"); clearTimeout(toast.timer); toast.timer = setTimeout(() => el.classList.remove("show"), 1800); }

    function openSheet(title, html, cleanup) {
      if (sheetCleanup) sheetCleanup();
      sheetCleanup = cleanup || null;
      $("#sheetTitle").textContent = title;
      $("#sheetBody").innerHTML = html;
      $("#sheet").classList.add("open");
      $("#sheetClose").focus();
    }
    function closeSheet() {
      if (sheetCleanup) sheetCleanup();
      sheetCleanup = null;
      $("#sheet").classList.remove("open");
      renderAll();
    }
    function setView(name) {
      currentView = name;
      ["today","path","library","places"].forEach(view => $("#view-" + view).hidden = view !== name);
      $$('[data-view]').forEach(button => button.setAttribute("aria-selected", String(button.dataset.view === name)));
      window.scrollTo(0, 0);
    }

    let jaVoice = null;
    function loadVoice() {
      if (!("speechSynthesis" in window)) return;
      jaVoice = speechSynthesis.getVoices().find(voice => /^ja/i.test(voice.lang)) || null;
    }
    function speak(text) {
      if (!("speechSynthesis" in window)) { toast("Speech is not available in this browser."); return; }
      loadVoice();
      try {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "ja-JP";
        utterance.rate = 0.82;
        if (jaVoice) utterance.voice = jaVoice;
        if (speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();
        speechSynthesis.speak(utterance);
      } catch (error) { toast("Could not play this phrase."); }
    }

    function phraseMarkup(phrases) {
      return `<div class="phrase-list">${phrases.map(([jp,reading,en]) => `<div class="phrase"><span><span class="phrase-jp" lang="ja">${esc(jp)}</span><span class="phrase-reading">${esc(reading)}</span><span class="phrase-en">${esc(en)}</span></span><button type="button" class="listen" data-say="${esc(jp)}" aria-label="Listen to ${esc(jp)}">▶</button></div>`).join("")}</div>`;
    }
    function bindListen(root = document) { $$('[data-say]', root).forEach(button => button.addEventListener("click", () => speak(button.dataset.say))); }

    function openLesson(index) {
      const lesson = lessons[index];
      openSheet(`Lesson ${index + 1} · ${lesson.title}`, `<p class="sheet-lede">${esc(lesson.focus)} Listen first, then repeat each phrase out loud.</p>${phraseMarkup(lesson.phrases)}<div class="sheet-actions"><button type="button" class="btn" id="completeLesson">${state.done[index] ? "Practice complete ✓" : "Complete lesson"}</button></div>`);
      bindListen($("#sheetBody"));
      $("#completeLesson").addEventListener("click", () => {
        state.done[index] = true; state.lastLesson = index; save(); closeSheet(); toast("Lesson complete.");
      });
    }

    function openPlaceRoute(key) {
      const route = placeRoutes[key];
      if (!route) return;
      const groups = route.groups.map((group, index) => `<section class="route-group"><div class="route-group-head"><h3>${esc(group.title)}</h3><span>${String(index + 1).padStart(2,"0")}</span></div><p class="route-note">${esc(group.note)}</p>${phraseMarkup(group.phrases)}</section>`).join("");
      const guide = route.guideUrl ? `<a class="btn" href="${esc(route.guideUrl)}">${esc(route.guideLabel)} →</a>` : `<span class="btn ghost" aria-disabled="true">${esc(route.guideLabel)}</span>`;
      openSheet(`${route.title} applied route`, `<p class="sheet-lede">Use the foundation in context. Move through three small situations without turning the route into a script.</p>${groups}<div class="sheet-actions">${guide}</div>`);
      bindListen($("#sheetBody"));
    }

    function openLanguages() {
      openSheet("Choose a language", `<div class="language-switcher"><a class="language-track" href="korean.html"><span class="language-glyph" aria-hidden="true">한</span><span><b>Korean</b><small>15 lessons · 4 routes · Foundation complete</small></span><span class="language-state">Open →</span></a><div class="language-track is-current" aria-current="page"><span class="language-glyph jp" aria-hidden="true">あ</span><span><b>Japanese</b><small>15 lessons · Kyoto and Tokyo routes</small></span><span class="language-state">Current</span></div></div><a class="language-home" href="index.html">← First Words language home</a>`);
    }

    function renderToday() {
      const count = state.done.filter(Boolean).length;
      const index = nextLesson();
      const lesson = lessons[index];
      $("#view-today").innerHTML = `<div class="practice-hero"><div class="practice-grid"><div><div class="kicker">Japanese foundation</div><h1>${count === lessons.length ? "Keep the language close." : "One small lesson today."}</h1><p>${count === lessons.length ? "The foundation is complete. Revisit a lesson or carry the phrases into Kyoto and Tokyo." : lesson.focus}</p></div><div class="day-mark"><span>${String(index + 1).padStart(2,"0")}</span><small>${count}/${lessons.length} complete</small></div></div><div class="hero-action"><button type="button" class="btn dark" id="todayLesson">${count === lessons.length ? "Revisit final lesson" : `Begin ${lesson.title}`}</button><button type="button" class="btn dark" id="todayPlaces">Open place routes</button></div></div><div class="today-strip"><div><span>Track</span><b>Japanese</b></div><div><span>Next</span><b>${esc(lesson.title)}</b></div><div><span>Routes</span><b>Kyoto · Tokyo</b></div></div><header class="view-heading"><div class="kicker">Daily rhythm</div><h1>Listen. Repeat. Place.</h1><p>Build the foundation in sequence, then use the same language inside two different city rhythms.</p></header>`;
      $("#todayLesson").addEventListener("click", () => openLesson(index));
      $("#todayPlaces").addEventListener("click", () => setView("places"));
    }
    function renderPath() {
      const count = state.done.filter(Boolean).length;
      $("#view-path").innerHTML = `<header class="view-heading"><div class="kicker">Curriculum</div><h1>Fifteen foundations</h1><p>Four connected chapters move from script and first exchanges into practical language and a short conversation.</p></header><div class="path-meter"><div class="meter"><i style="width:${count / lessons.length * 100}%"></i></div><b>${count}/${lessons.length}</b></div><div class="lesson-list">${lessons.map((lesson,index) => `<button type="button" class="lesson-row ${state.done[index] ? "is-done" : ""}" data-lesson="${index}"><span class="lesson-num">${state.done[index] ? "✓" : String(index + 1).padStart(2,"0")}</span><span><span class="lesson-title">${esc(lesson.title)}</span><span class="lesson-focus">${esc(lesson.chapter)} · ${esc(lesson.focus)}</span></span><span class="lesson-state">${state.done[index] ? "Done" : index === nextLesson() ? "Next" : "Open"}</span></button>`).join("")}</div>`;
      $$('[data-lesson]', $("#view-path")).forEach(button => button.addEventListener("click", () => openLesson(Number(button.dataset.lesson))));
    }
    function renderLibrary(query = "", shouldFocus = false) {
      const q = query.trim().toLowerCase();
      const all = lessons.flatMap(lesson => lesson.phrases.map(phrase => ({ lesson: lesson.title, phrase })));
      const filtered = all.filter(item => !q || item.phrase.join(" ").toLowerCase().includes(q) || item.lesson.toLowerCase().includes(q));
      $("#view-library").innerHTML = `<header class="view-heading"><div class="kicker">Phrasebook</div><h1>Your Japanese library</h1><p>Search every sound and phrase in the foundation, then listen again whenever you need it.</p></header><div class="library-tools"><input class="search" id="searchPhrases" type="search" value="${esc(query)}" placeholder="Search Japanese, reading, or meaning" aria-label="Search phrases"></div>${filtered.length ? phraseMarkup(filtered.map(item => item.phrase)) : `<p class="sheet-lede">No phrases match that search.</p>`}`;
      $("#searchPhrases").addEventListener("input", event => renderLibrary(event.target.value, true));
      if (shouldFocus) { const input = $("#searchPhrases"); input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
      bindListen($("#view-library"));
    }
    function renderPlaces() {
      const cards = Object.entries(placeRoutes).map(([key,route], index) => `<article class="place-card"><div><span class="place-mark-small" lang="ja">${route.mark}</span><div class="kicker">Route ${String(index + 1).padStart(2,"0")}</div><h2>${esc(route.title)}</h2><p>${esc(route.label)}. ${esc(route.intro)}</p></div><button type="button" class="btn small" data-place="${key}">Open route</button></article>`).join("");
      $("#view-places").innerHTML = `<div class="place-intro"><div><div class="kicker">Language in place</div><h1>Two cities, two rhythms.</h1><p>Kyoto rewards patience and permission. Tokyo rewards clarity and orientation. The same foundation adapts to both.</p></div><div class="place-kanji" lang="ja">日本</div></div><div class="place-grid">${cards}</div>`;
      $$('[data-place]', $("#view-places")).forEach(button => button.addEventListener("click", () => openPlaceRoute(button.dataset.place)));
    }
    function renderTop() { $("#doneCount").textContent = state.done.filter(Boolean).length; }
    function renderAll() { renderTop(); renderToday(); renderPath(); renderLibrary(); renderPlaces(); setView(currentView); }

    $$('[data-view]').forEach(button => button.addEventListener("click", () => setView(button.dataset.view)));
    $("#languageBtn").addEventListener("click", openLanguages);
    $("#sheetClose").addEventListener("click", closeSheet);
    $("#sheetBackdrop").addEventListener("click", closeSheet);
    document.addEventListener("keydown", event => { if (event.key === "Escape" && $("#sheet").classList.contains("open")) closeSheet(); });
    if ("speechSynthesis" in window) { loadVoice(); speechSynthesis.addEventListener("voiceschanged", loadVoice); }
    renderAll();
    const requestedPlace = new URLSearchParams(location.search).get("place");
    if (requestedPlace && placeRoutes[requestedPlace]) { setView("places"); requestAnimationFrame(() => openPlaceRoute(requestedPlace)); }
    if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
  </script>
  <script defer src="../../analytics.js"></script>
</body>
</html>
